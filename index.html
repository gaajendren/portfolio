<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaajendren</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://kit.fontawesome.com/ff3606fe13.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-[#1A1A1A]">

    <nav class="z-10 fixed top-0 right-0 left-0 h-17 max-w-5xl m-auto">
        <div class="flex flex-row justify-between items-center p-6">
            <div class="rounded-full shadow-lg w-11 h-11 overflow-hidden cursor-pointer transform transition-all duration-300 hover:scale-110 ">
                <img class="object-cover" src="logo.jpg" alt="">
            </div>
            <i class="fa-solid fa-envelope fa-xl text-white transform transition-all duration-300 hover:scale-110 "></i>     
        </div>
    </nav>

    <div class="pt-32 max-w-5xl m-auto relative flex justify-center items-center p-6">
        <div class="w-full relative group flex items-center justify-center">
           
            <div class="absolute inset-0 overflow-hidden rounded-2xl">
                <div class="absolute inset-0 bg-gradient-to-tr from-[#2e2e2e] to-[#575757]"></div>
            </div>
    
            <!-- Your portrait image -->
            <div class="relative max-w-72 w-full h-full flex items-center justify-center ">
                <img src="port.png" alt="Portrait" class="object-cover w-full h-full m-auto">
            </div>
            
        </div>
    
        <div class="absolute bottom-2 left-0 right-0 m-auto text-center">
            <span class="text-white font-bold text-3xl">GAAJENDREN VIVEGANANTHAN</span>
        </div>
    </div>

    <div class="pt-4 max-w-5xl m-auto p-6 ">
        <div class="w-fit relative p-3 flex justify-between items-center w-full">

            <div class="-z-10 absolute inset-0 overflow-hidden rounded-2xl">
                <div class="absolute inset-0"></div>
            </div>

            <div class="text-white font-sans text-xl">Software Engineer / Developer</div>

            <div class="rounded-md  px-4 py-2 text-sm font-semibold text-gray-700 ring-1 ring-white-500  dark:text-gray-200 cursor-pointer">Get In Touch</div>
        </div>

    </div>

</body>


</html>
